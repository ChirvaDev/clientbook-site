# Site settings — used by every page, the blog, SEO tags and the sitemap.
title: Client Book
tagline: Appointments & Clients
description: Client Book is a simple appointment book and client list for beauty pros, stylists and freelancers. Schedule bookings, keep client notes and track your income.
lang: en

url: "https://myclientbook.app"
baseurl: ""

# Change these in one place — they are used across all pages.
email: support@myclientbook.app
# Leave empty until the app is live. While empty, all download buttons show "Coming soon".
# Client Book Apple ID (App Store Connect): 6810140286 -> on release day set app_store_id: "6810140286".
# Do not set it earlier: apps.apple.com/app/id6810140286 returns 404 until the app is published.
app_store_id: ""
# App Store Connect campaign provider token (App Analytics -> Campaigns -> Generate Campaign Link -> number after "pt=").
# Fill in after release. When set, every download button gets ?pt=…&ct=<page>-<place>&mt=8, so App Store Connect
# shows downloads per page and per button. Same provider token as Nursly (one developer account).
app_store_pt: ""

# Cloudflare Web Analytics token (Cloudflare -> Analytics & Logs -> Web Analytics). Empty = no analytics.
cloudflare_analytics_token: "43e9890a6fc24ce0a9a67a06c48474cf"

# Shown as the author of guides in Google (jekyll-seo-tag).
author: Client Book
logo: /assets/apple-touch-icon.png
social:
  name: Client Book

markdown: kramdown
timezone: UTC

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

feed:
  path: guides/feed.xml

defaults:
  - scope: { path: "" }
    values: { image: /assets/og-image.jpg }
  - scope: { path: "", type: posts }
    values: { layout: post, permalink: "/guides/:title/" }

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
