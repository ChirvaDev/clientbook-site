<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}"><img src="{{ '/assets/icon.jpg' | relative_url }}" alt="Client Book logo" width="32" height="32">{{ site.title }}</a>
    <nav class="nav" aria-label="Main">
      <a href="{{ '/#features' | relative_url }}">Features</a>
      <a href="{{ '/blog/' | relative_url }}"{% if page.url contains '/blog/' %} aria-current="page"{% endif %}>Blog</a>
      <a href="{{ '/support.html' | relative_url }}"{% if page.url == '/support.html' %} aria-current="page"{% endif %}>Support</a>
    </nav>
    <div class="header-actions">
      {%- if site.app_store_id and site.app_store_id != "" %}
      <a class="btn btn-sm" href="https://apps.apple.com/app/id{{ site.app_store_id }}">Download</a>
      {%- else %}
      <span class="btn btn-sm btn-soon" aria-disabled="true">Coming soon</span>
      {%- endif %}
      <details class="menu">
        <summary aria-label="Menu"><span></span><span></span></summary>
        <nav class="menu-panel" aria-label="Mobile">
          <a href="{{ '/#features' | relative_url }}">Features</a>
          <a href="{{ '/blog/' | relative_url }}">Blog</a>
          <a href="{{ '/support.html' | relative_url }}">Support</a>
          <a href="{{ '/privacy.html' | relative_url }}">Privacy Policy</a>
          <a href="{{ '/terms.html' | relative_url }}">Terms of Use</a>
        </nav>
      </details>
    </div>
  </div>
</header>
