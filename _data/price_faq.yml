- q: How do I calculate the price of a service?
  a: Add up what you want to earn in a year and your yearly business costs, then divide by the hours you actually spend with clients in a year. That gives your cost per hour. Multiply it by the time the service takes (including setup and cleanup) and add the products you use. The result is the minimum you should charge.
- q: How much should I charge for nails?
  a: It depends on your costs, your area and how long each set takes you. As an example, if you need $45 an hour to cover your income goal and costs, a 90-minute gel set with $6 of products should cost at least $73.50 — so around $75. Use the calculator with your own numbers.
- q: How much should I charge for lashes?
  a: Lash sets take longer than most services, so time is the biggest part of the price. A 2-hour classic full set at $45 an hour with $8 of supplies comes to at least $98. Fills are shorter, so they cost less. Check local prices too, but don't go below your own minimum.
- q: Should I just copy what other salons charge?
  a: Local prices tell you what clients are used to paying, but not whether those prices work for you. Your rent, speed, products and income goal are different. Calculate your minimum first, then compare it with the market.
- q: What should I include in business costs?
  a: Rent or booth rent, insurance, licences, software and booking tools, card fees, education, tools and equipment, laundry, marketing and anything else you pay to run the business. Products you use on a specific service go into the per-service product cost instead.
- q: Does the calculator include taxes?
  a: No. The income goal is what you want to earn before income tax. If you want a take-home figure after tax, set the goal higher, or ask an accountant how much to set aside in your country.
