- q: Is the client record card template really free?
  a: Yes. Download, print and copy it as often as you like — no email or sign-up needed.
- q: What should be on a client record card?
  a: The client's name and contact details, birthday, allergies and sensitivities, patch test results, health notes that affect treatments, the services and products they like, things to avoid, and a log of every visit with the date, service, products or formula used and price.
- q: Letter or A4 — which one should I download?
  a: Letter is the standard paper size in the US and Canada. A4 is used in the UK, Australia and most other countries. The content is the same.
- q: Can I use it for nails, lashes, brows or massage, not just hair?
  a: Yes. The card is made for any one-to-one service — hair, nails, lashes, brows, makeup, skin care, massage or barbering. Use "Products / formula" for color formulas, gel brands, lash curl and length, or massage oils.
- q: How long should I keep client records?
  a: There is no single rule for beauty pros — it depends on your country, your insurer and the service. Many keep cards for as long as the client is active, plus a few years after the last visit. If you do treatments with a higher risk of reactions, ask your insurer what they expect.
- q: Can I fill it in on my phone or iPad?
  a: The PDF is made for printing, but you can also write on it in any PDF app that supports annotations, such as Markup on iPhone and iPad.
