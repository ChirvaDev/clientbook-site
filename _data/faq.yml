# Shown on the home page and as FAQ rich results in Google.
- q: Where is my data stored?
  a: On your iPhone only. Client Book has no accounts and no servers that store your clients or appointments. We can't see your data — and neither can anyone else.
- q: Do I need to create an account?
  a: No. Download the app and start adding clients right away. No sign-up, no email, no password.
- q: Can I import my existing clients?
  a: Yes. Add clients straight from your iPhone contacts, or import a CSV file from a spreadsheet or another app.
- q: How do I move my data to a new phone?
  a: Go to Settings → Data & Backup → Export Backup and save the file. On the new phone, open the same screen and tap Restore from Backup. Your data always leaves with you.
- q: Who is Client Book for?
  a: Solo service pros who book their own clients — hairstylists, barbers, nail, lash and makeup artists, estheticians, tattoo artists, massage therapists and other freelancers.
- q: Is there an Android version?
  a: Not yet. Client Book is available for iPhone.
